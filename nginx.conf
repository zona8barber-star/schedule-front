server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Preserve runtime config strategy by serving config JSON as static files.
  location ~* ^/config\.(development|qa|production)\.json$ {
    add_header Cache-Control "no-store, no-cache, must-revalidate";
    try_files $uri =404;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }

  location = /health {
    access_log off;
    default_type text/plain;
    return 200 'ok';
  }
}
