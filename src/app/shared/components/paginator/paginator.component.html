@if (totalCount() > 0) {
  <nav class="paginator" [attr.aria-label]="label()">
    <p class="paginator__summary" aria-live="polite">
      {{ firstItem() }}–{{ lastItem() }} de {{ totalCount() }}
      <span class="paginator__page">· Página {{ page() }} de {{ totalPages() }}</span>
    </p>

    <div class="paginator__controls">
      <button
        type="button"
        class="paginator__btn"
        aria-label="Página anterior"
        [disabled]="!hasPrevious() || disabled()"
        (click)="goTo(page() - 1)"
      >
        ‹ Anterior
      </button>
      <span class="paginator__current" aria-current="page">{{ page() }}</span>
      <button
        type="button"
        class="paginator__btn"
        aria-label="Página siguiente"
        [disabled]="!hasNext() || disabled()"
        (click)="goTo(page() + 1)"
      >
        Siguiente ›
      </button>

      @if (pageSizeOptions().length) {
        <label class="paginator__size">
          <span>Por página</span>
          <select [value]="pageSize()" [disabled]="disabled()" (change)="onPageSizeChange($any($event.target).value)">
            @for (size of pageSizeOptions(); track size) {
              <option [value]="size" [selected]="size === pageSize()">{{ size }}</option>
            }
          </select>
        </label>
      }
    </div>
  </nav>
}
