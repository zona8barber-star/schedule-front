<div class="ticker" aria-hidden="true">
  <div class="ticker__track">
    @for (group of [0, 1]; track group) {
      <div class="ticker__group">
        @for (item of items(); track $index) {
          <span class="ticker__item">{{ item }}</span>
          <span class="ticker__dot">●</span>
        }
      </div>
    }
  </div>
</div>
