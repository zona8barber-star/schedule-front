@if (state) {
  <div
    class="confirm-overlay"
    role="dialog"
    aria-modal="true"
    [attr.aria-label]="state.options.title"
    (click)="cancel()"
  >
    <div class="confirm-modal" (click)="$event.stopPropagation()">

      <!-- Icon -->
      <div class="confirm-modal__icon" [class.confirm-modal__icon--danger]="state.options.danger !== false">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6" />
          <line x1="10" y1="11" x2="10" y2="17" />
          <line x1="14" y1="11" x2="14" y2="17" />
        </svg>
      </div>

      <!-- Text -->
      <div class="confirm-modal__body">
        <h2 class="confirm-modal__title">{{ state.options.title }}</h2>
        @if (state.options.message) {
          <p class="confirm-modal__message">{{ state.options.message }}</p>
        }
      </div>

      <!-- Actions -->
      <div class="confirm-modal__actions">
        <button class="confirm-modal__btn confirm-modal__btn--cancel" type="button" (click)="cancel()">
          {{ state.options.cancelLabel || 'Cancelar' }}
        </button>
        <button
          class="confirm-modal__btn"
          [class.confirm-modal__btn--danger]="state.options.danger !== false"
          [class.confirm-modal__btn--primary]="state.options.danger === false"
          type="button"
          (click)="confirm()"
        >
          {{ state.options.confirmLabel || 'Sí, eliminar' }}
        </button>
      </div>

    </div>
  </div>
}
