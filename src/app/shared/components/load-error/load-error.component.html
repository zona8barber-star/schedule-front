<section class="load-error" role="alert" data-testid="load-error">
  <span class="load-error__icon" aria-hidden="true">
    @if (offline()) {
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <path d="M8.288 15.038a5.25 5.25 0 017.424 0M5.106 11.856c3.807-3.808 9.98-3.808 13.788 0M1.924 8.674c5.565-5.565 14.587-5.565 20.152 0M12 18.75h.008v.008H12v-.008z" />
        <path d="M3 3l18 18" />
      </svg>
    } @else {
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="9" />
        <path d="M12 7.5v5M12 16h.01" />
      </svg>
    }
  </span>
  <h2 class="load-error__title">{{ title() }}</h2>
  <p class="load-error__message">{{ message() }}</p>
  <button
    class="load-error__retry"
    type="button"
    data-testid="load-error-retry"
    [disabled]="retrying()"
    (click)="retry.emit()"
  >
    {{ retrying() ? 'Reintentando...' : 'Reintentar' }}
  </button>
</section>
